name: Build iOS ESP
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos environment
        run: |
          git clone --recursive https://github.com $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          curl -LO https://github.com
          tar -xf iPhoneOS14.5.sdk.tar.xz -C $HOME/theos/sdks/
          rm iPhoneOS14.5.sdk.tar.xz

      - name: Compile Tweak
        run: |
          export THEOS=$HOME/theos
          make ARCHS="arm64" TARGET="iphone:clang:14.5:14.0" FINALPACKAGE=1
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyCleanESP
          path: .theos/obj/*.dylib
