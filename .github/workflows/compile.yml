name: Build iOS ESP
on:
  workflow_dispatch:

jobs:
  build:
    # Changed to macos-latest for faster queue times
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos environment
        run: |
          # Added full Theos repository URL
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          # Added standard URL for iOS 14.5 SDK (xybp888's popular SDK repo)
          curl -LO https://github.com/xybp888/iOS-SDKs/releases/download/14.5/iPhoneOS14.5.sdk.tar.xz
          tar -xf iPhoneOS14.5.sdk.tar.xz -C $HOME/theos/sdks/
          rm iPhoneOS14.5.sdk.tar.xz

      - name: Compile Tweak
        run: |
          export THEOS=$HOME/theos
          make ARCHS="arm64" TARGET="iphone:clang:14.5:14.0" FINALPACKAGE=1
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyCleanESP
          path: .theos/obj/*.dylib
